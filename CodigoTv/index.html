
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flix TV</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: auto;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* =========================
   CABECERA
========================= */

header {
    min-height: 90px;
    display: flex;
    align-items: center;
    padding: 0 45px;
    gap: 25px;
}

.logo {
    font-size: 36px;
    font-weight: bold;
    white-space: nowrap;
    flex-shrink: 0;
}

.logo span {
    color: #00ff00;
}

/* LUPA */

.search-toggle {
    width: 45px;
    height: 45px;
    border: 2px solid transparent;
    border-radius: 6px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    outline: none;
    flex-shrink: 0;
}

.search-toggle svg {
    width: 28px;
    height: 28px;
}

.search-toggle:focus {
    border-color: white;
    background: #222;
}

/* NAVEGACIÓN */

.header-content {
    flex: 1;
    min-width: 0;
}

nav {
    display: flex;
    align-items: center;
    gap: 35px;
}

nav a {
    color: #aaa;
    text-decoration: none;
    font-size: 20px;
    white-space: nowrap;
    outline: none;
}

nav a:focus,
nav a.activo {
    color: white;
    transform: scale(1.05);
}

/* =========================
   CATÁLOGO
========================= */

main {
    padding: 20px 45px 50px;
}

.peliculas {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    width: 100%;
    padding: 8px 5px 25px;
}

.pelicula {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 10px;
    overflow: hidden;
    background: #181818;
    outline: none;
    border: 3px solid transparent;
    transition: transform .12s ease-out,
                border-color .12s ease-out;
}

.pelicula img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.pelicula:focus {
    transform: scale(1.04);
    border-color: white;
    box-shadow: 0 0 14px rgba(255,255,255,.2);
    z-index: 10;
}

.sin-resultados {
    display: none;
    text-align: center;
    color: #aaa;
    font-size: 19px;
    padding: 60px 10px;
}

/* =========================
   PANTALLA DE BÚSQUEDA
========================= */

#searchScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #080808;
    display: none;
    flex-direction: column;
    padding: 25px 45px;
    overflow-y: auto;
}

#searchScreen.abierta {
    display: flex;
}

/* PARTE SUPERIOR */

.search-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
    margin-bottom: 30px;
    flex-shrink: 0;
}

.search-title {
    font-size: 30px;
    font-weight: bold;
}

.search-title span {
    color: #00ff00;
}

.search-close {
    width: 45px;
    height: 45px;
    border: 2px solid transparent;
    border-radius: 6px;
    background: #181818;
    color: white;
    font-size: 30px;
    cursor: pointer;
    outline: none;
}

.search-close:focus {
    border-color: white;
}

/* CONTENEDOR PRINCIPAL */

.search-content {
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr);
    gap: 45px;
    flex: 1;
    min-height: 0;
}

/* =========================
   TECLADO VIRTUAL
========================= */

.keyboard-panel {
    min-width: 0;
}

.search-label {
    color: #aaa;
    font-size: 16px;
    margin-bottom: 12px;
}

.search-display {
    width: 100%;
    min-height: 55px;
    background: #181818;
    border: 2px solid #444;
    border-radius: 5px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    margin-bottom: 20px;
    font-size: 22px;
    overflow: hidden;
}

#searchText {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.keyboard {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 9px;
}

.key {
    min-height: 53px;
    border: 2px solid transparent;
    border-radius: 5px;
    background: #252525;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    outline: none;
    transition: background .1s ease;
}

.key:focus {
    background: #e50914;
    border-color: white;
    transform: scale(1.04);
    z-index: 2;
}

.key:active {
    background: #b20710;
}

.key.special {
    background: #333;
    font-size: 14px;
}

.key.special:focus {
    background: #e50914;
}

.key.space {
    grid-column: span 3;
}

/* =========================
   RESULTADOS
========================= */

.results-panel {
    min-width: 0;
    overflow-y: auto;
}

.results-title {
    font-size: 23px;
    margin-bottom: 20px;
}

.results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 20px;
    padding: 5px;
}

.result-poster {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 8px;
    overflow: hidden;
    border: 3px solid transparent;
    background: #181818;
    outline: none;
    transition: transform .12s ease;
}

.result-poster img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.result-poster:focus {
    border-color: white;
    transform: scale(1.04);
    box-shadow: 0 0 15px rgba(255,255,255,.2);
    z-index: 5;
}

.result-name {
    display: block;
    color: white;
    font-size: 14px;
    margin-top: 7px;
    text-align: center;
}

.no-search-results {
    display: none;
    color: #aaa;
    font-size: 18px;
    padding: 30px 5px;
}

/* =========================
   CELULARES
========================= */

@media (max-width: 600px) {

    header {
        min-height: auto;
        padding: 18px 18px 12px;
        flex-wrap: wrap;
        gap: 10px;
    }

    .logo {
        font-size: 29px;
    }

    .search-toggle {
        width: 38px;
        height: 38px;
    }

    .search-toggle svg {
        width: 24px;
        height: 24px;
    }

    .header-content {
        flex: 0 0 100%;
        width: 100%;
    }

    nav {
        width: 100%;
        gap: 25px;
        overflow-x: auto;
        padding: 5px 2px 10px;
        scrollbar-width: none;
    }

    nav::-webkit-scrollbar {
        display: none;
    }

    nav a {
        font-size: 15px;
    }

    main {
        padding: 15px 12px 35px;
    }

    .peliculas {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        padding: 5px 2px 20px;
    }

    .pelicula {
        border-radius: 7px;
        border-width: 2px;
    }

    /* BÚSQUEDA MÓVIL */

    #searchScreen {
        padding: 15px;
    }

    .search-header {
        margin-bottom: 20px;
    }

    .search-title {
        font-size: 24px;
    }

    .search-content {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    .keyboard {
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
    }

    .key {
        min-height: 42px;
        font-size: 16px;
    }

    .key.special {
        font-size: 11px;
    }

    .key.space {
        grid-column: span 3;
    }

    .search-display {
        min-height: 45px;
        font-size: 18px;
        margin-bottom: 14px;
    }

    .results-title {
        font-size: 19px;
        margin-bottom: 12px;
    }

    .results-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
    }
}

/* =========================
   TABLETS
========================= */

@media (min-width: 601px) and (max-width: 1024px) {

    header {
        padding: 0 30px;
        gap: 20px;
    }

    .logo {
        font-size: 32px;
    }

    nav {
        gap: 20px;
    }

    nav a {
        font-size: 18px;
    }

    main {
        padding: 20px 30px 40px;
    }

    .peliculas {
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 20px;
    }

    .search-content {
        grid-template-columns: 310px minmax(0, 1fr);
        gap: 25px;
    }

    .results-grid {
        grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
        gap: 15px;
    }
}

/* =========================
   SMART TV
========================= */

@media (min-width: 1200px) {

    header {
        min-height: 110px;
        padding: 0 65px;
        gap: 30px;
    }

    .logo {
        font-size: 42px;
    }

    nav {
        gap: 35px;
    }

    nav a {
        font-size: 23px;
    }

    .search-toggle {
        width: 50px;
        height: 50px;
    }

    .search-toggle svg {
        width: 32px;
        height: 32px;
    }

    main {
        padding: 25px 65px 60px;
    }

    .peliculas {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 25px;
        padding: 10px 5px 30px;
    }

    #searchScreen {
        padding: 35px 65px;
    }

    .search-header {
        margin-bottom: 35px;
    }

    .search-title {
        font-size: 38px;
    }

    .search-content {
        grid-template-columns: 430px minmax(0, 1fr);
        gap: 55px;
    }

    .search-display {
        min-height: 65px;
        font-size: 27px;
    }

    .keyboard {
        gap: 12px;
    }

    .key {
        min-height: 65px;
        font-size: 25px;
    }

    .key.special {
        font-size: 17px;
    }

    .results-title {
        font-size: 28px;
    }

    .results-grid {
        grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
        gap: 24px;
    }
}

@media (min-width: 1600px) {

    .peliculas {
        grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
        gap: 30px;
    }

    .search-content {
        grid-template-columns: 480px minmax(0, 1fr);
    }
}
</style>

<script>

/* =====================================
   ELEMENTOS PRINCIPALES
===================================== */

const galeria = document.getElementById("movieGallery");
const base = document.getElementById("basePeliculas");

const searchScreen = document.getElementById("searchScreen");
const searchToggle = document.getElementById("searchToggle");
const searchClose = document.getElementById("searchClose");

const searchText = document.getElementById("searchText");
const searchResults = document.getElementById("searchResults");

const resultsTitle = document.getElementById("resultsTitle");
const noSearchResults = document.getElementById("noSearchResults");

const botonesCategoria = document.querySelectorAll(
    "#menuCategorias a"
);

let categoriaActual = "todas";
let textoBusqueda = "";
let buscando = false;


/* =====================================
   CARGAR CATÁLOGO
===================================== */

function cargarCatalogo() {

    const peliculas = Array.from(
        base.querySelectorAll("a")
    );

    galeria.innerHTML = "";

    peliculas.forEach(pelicula => {

        const poster = document.createElement("a");

        poster.className = "pelicula";
        poster.href = pelicula.getAttribute("href");
        poster.tabIndex = 0;

        poster.dataset.categoria =
            pelicula.dataset.categoria || "";

        poster.dataset.nombre =
            pelicula.dataset.nombre || "";

        const imagen = pelicula.querySelector("img");

        if (imagen) {

            const nuevaImagen = document.createElement("img");

            nuevaImagen.src = imagen.getAttribute("src");
            nuevaImagen.alt = poster.dataset.nombre || "Película";

            poster.appendChild(nuevaImagen);

        }

        galeria.appendChild(poster);

    });

}

cargarCatalogo();


/* =====================================
   NORMALIZAR TEXTO
===================================== */

function normalizarTexto(texto) {

    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

}


/* =====================================
   FILTRAR CATÁLOGO
===================================== */

function filtrarCategoria(categoria) {

    categoriaActual = categoria;

    aplicarFiltros();

    botonesCategoria.forEach(boton => {

        boton.classList.toggle(
            "activo",
            boton.dataset.filtro === categoria
        );

    });

    window.scrollTo({
        top: 0,
        behavior: "auto"
    });

}

function aplicarFiltros() {

    const texto = normalizarTexto(
        document.getElementById("searchInput")?.value || ""
    );

    const posters = document.querySelectorAll(
        "#movieGallery .pelicula"
    );

    let encontrados = 0;

    posters.forEach(poster => {

        const categoriaCoincide =
            categoriaActual === "todas" ||
            poster.dataset.categoria === categoriaActual;

        const nombreCoincide =
            normalizarTexto(poster.dataset.nombre || "")
            .includes(texto);

        const mostrar = categoriaCoincide && nombreCoincide;

        poster.style.display = mostrar ? "block" : "none";

        if (mostrar) encontrados++;

    });

    document.getElementById("sinResultados").style.display =
        encontrados === 0 ? "block" : "none";

}


/* =====================================
   ABRIR Y CERRAR BÚSQUEDA
===================================== */

function abrirBuscador() {

    buscando = true;

    textoBusqueda = "";

    searchText.textContent = "";

    searchScreen.classList.add("abierta");

    actualizarResultados();

    setTimeout(() => {

        const primeraTecla = document.querySelector(
            '#virtualKeyboard button[data-key="A"]'
        );

        primeraTecla?.focus({
            preventScroll: true
        });

    }, 100);

}

function cerrarBuscador() {

    buscando = false;

    textoBusqueda = "";

    searchText.textContent = "";

    searchScreen.classList.remove("abierta");

    searchToggle.focus({
        preventScroll: true
    });

}

searchToggle.addEventListener("click", abrirBuscador);

searchClose.addEventListener("click", cerrarBuscador);


/* =====================================
   ACTUALIZAR TEXTO DE BÚSQUEDA
===================================== */

function actualizarTexto() {

    searchText.textContent = textoBusqueda;

}


/* =====================================
   TECLADO VIRTUAL
===================================== */

function escribirCaracter(caracter) {

    textoBusqueda += caracter;

    actualizarTexto();

    actualizarResultados();

}

function borrarCaracter() {

    textoBusqueda = textoBusqueda.slice(0, -1);

    actualizarTexto();

    actualizarResultados();

}

function limpiarBusqueda() {

    textoBusqueda = "";

    actualizarTexto();

    actualizarResultados();

}


/* =====================================
   EVENTOS DEL TECLADO
===================================== */

document.querySelectorAll("#virtualKeyboard button").forEach(boton => {

    boton.addEventListener("click", function() {

        const caracter = this.dataset.key;
        const accion = this.dataset.action;

        if (caracter) {

            escribirCaracter(caracter);

        }

        if (accion === "backspace") {

            borrarCaracter();

        }

        if (accion === "clear") {

            limpiarBusqueda();

        }

        if (accion === "space") {

            escribirCaracter(" ");

        }

        actualizarNavegacion();

    });

});


/* =====================================
   MOSTRAR RESULTADOS
===================================== */

function actualizarResultados() {

    const peliculas = Array.from(
        base.querySelectorAll("a")
    );

    const texto = normalizarTexto(textoBusqueda);

    searchResults.innerHTML = "";

    let encontrados = 0;

    peliculas.forEach(pelicula => {

        const nombre = pelicula.dataset.nombre || "";

        const categoria = pelicula.dataset.categoria || "";

        const categoriaCoincide =
            categoriaActual === "todas" ||
            categoria === categoriaActual;

        const nombreCoincide =
            normalizarTexto(nombre).includes(texto);

        if (!nombreCoincide) return;

        const imagen = pelicula.querySelector("img");

        if (!imagen) return;

        const contenedor = document.createElement("div");

        const poster = document.createElement("a");

        poster.className = "result-poster";
        poster.href = pelicula.getAttribute("href");
        poster.tabIndex = 0;

        const nuevaImagen = document.createElement("img");

        nuevaImagen.src = imagen.getAttribute("src");
        nuevaImagen.alt = nombre;

        poster.appendChild(nuevaImagen);

        const titulo = document.createElement("span");

        titulo.className = "result-name";
        titulo.textContent = nombre;

        contenedor.appendChild(poster);
        contenedor.appendChild(titulo);

        searchResults.appendChild(contenedor);

        encontrados++;

    });

    resultsTitle.textContent = textoBusqueda.trim()
        ? "Resultados de búsqueda"
        : "Todas las películas";

    noSearchResults.style.display =
        encontrados === 0 ? "block" : "none";

    actualizarNavegacion();

}


/* =====================================
   CATEGORÍAS
===================================== */

botonesCategoria.forEach(boton => {

    boton.addEventListener("click", function(e) {

        e.preventDefault();

        filtrarCategoria(this.dataset.filtro);

    });

});


/* =====================================
   NAVEGACIÓN CON CONTROL REMOTO
===================================== */

let elementosNavegacion = [];

function actualizarNavegacion() {

    elementosNavegacion = Array.from(
        document.querySelectorAll(
            '#menuCategorias a, #searchToggle, ' +
            '#virtualKeyboard button, #searchClose, ' +
            '#searchResults .result-poster, #movieGallery .pelicula'
        )
    )
    .filter(el => {

        return el.offsetWidth > 0 &&
               el.offsetHeight > 0 &&
               el.getClientRects().length > 0;

    })
    .map(el => {

        const rect = el.getBoundingClientRect();

        return {
            elemento: el,
            x: rect.left + rect.width / 2,
            y: rect.top + rect.height / 2
        };

    });

}

actualizarNavegacion();

window.addEventListener("resize", actualizarNavegacion);


/* =====================================
   MOVIMIENTO CON FLECHAS
===================================== */

document.addEventListener("keydown", function(e) {

    if (!buscando) {

        const teclas = [
            "ArrowRight",
            "ArrowLeft",
            "ArrowUp",
            "ArrowDown"
        ];

        if (!teclas.includes(e.key)) return;

        const actual = document.activeElement;

        if (
            actual &&
            actual.tagName === "INPUT"
        ) return;

        e.preventDefault();

        navegarPorFlechas(e.key);

        return;

    }

    /* PANTALLA DE BÚSQUEDA */

    if (e.key === "Escape" || e.key === "Backspace") {

        e.preventDefault();

        if (e.key === "Escape") {

            cerrarBuscador();

        } else {

            borrarCaracter();

        }

        return;

    }

    if (e.key === "Enter") {

        const actual = document.activeElement;

        if (actual && actual.tagName === "BUTTON") {

            e.preventDefault();

            actual.click();

        }

        return;

    }

    const teclas = [
        "ArrowRight",
        "ArrowLeft",
        "ArrowUp",
        "ArrowDown"
    ];

    if (teclas.includes(e.key)) {

        e.preventDefault();

        navegarPorFlechas(e.key);

    }

});


/* =====================================
   SISTEMA DE MOVIMIENTO ESPACIAL
===================================== */

function navegarPorFlechas(tecla) {

    actualizarNavegacion();

    const actual = document.activeElement;

    const origen = elementosNavegacion.find(
        item => item.elemento === actual
    );

    if (!origen) {

        const primero = buscando
            ? document.querySelector('#virtualKeyboard button')
            : document.querySelector('#menuCategorias a');

        primero?.focus({
            preventScroll: true
        });

        return;

    }

    let mejorElemento = null;
    let menorDistancia = Infinity;

    for (const candidato of elementosNavegacion) {

        if (candidato.elemento === actual) continue;

        const dx = candidato.x - origen.x;
        const dy = candidato.y - origen.y;

        let valido = false;
        let distancia = Infinity;

        switch(tecla) {

            case "ArrowRight":

                valido = dx > 8;
                distancia = dx + Math.abs(dy) * 2.5;

                break;

            case "ArrowLeft":

                valido = dx < -8;
                distancia = Math.abs(dx) + Math.abs(dy) * 2.5;

                break;

            case "ArrowDown":

                valido = dy > 8;
                distancia = dy + Math.abs(dx) * 2.5;

                break;

            case "ArrowUp":

                valido = dy < -8;
                distancia = Math.abs(dy) + Math.abs(dx) * 2.5;

                break;

        }

        if (valido && distancia < menorDistancia) {

            menorDistancia = distancia;
            mejorElemento = candidato.elemento;

        }

    }

    if (mejorElemento) {

        mejorElemento.focus({
            preventScroll: true
        });

    }

}


/* =====================================
   SCROLL INTELIGENTE DEL CATÁLOGO
===================================== */

document.addEventListener("focusin", function(e) {

    if (buscando) return;

    const elemento = e.target;

    if (
        !elemento.classList.contains("pelicula") &&
        !elemento.closest("nav")
    ) return;

    if (elemento.closest("nav")) {

        window.scrollTo({
            top: 0,
            behavior: "auto"
        });

        return;

    }

    const rect = elemento.getBoundingClientRect();

    if (rect.top < 120) {

        window.scrollTo({
            top: Math.max(
                0,
                window.scrollY + rect.top - 120
            ),
            behavior: "auto"
        });

    }

    else if (rect.bottom > window.innerHeight - 100) {

        window.scrollTo({
            top:
                window.scrollY +
                rect.bottom -
                (window.innerHeight - 100),
            behavior: "auto"
        });

    }

});


/* =====================================
   ENTER EN EL CATÁLOGO
===================================== */

document.addEventListener("keydown", function(e) {

    if (buscando) return;

    if (e.key === "Enter") {

        const actual = document.activeElement;

        if (actual && actual.classList.contains("pelicula")) {

            e.preventDefault();

            actual.click();

        }

    }

});
